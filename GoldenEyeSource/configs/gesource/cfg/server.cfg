hostname "Zero Ping Heroes"

ge_gp_cyclefile gamecycle.txt

mapcyclefile mapcycle.txt

// Match (map) time limit, in minutes. 0 = no time limit.
// Default: 20
mp_timelimit 10

// Round time, in seconds. 0 = no time limit.
// Default: 240
ge_roundtime 0

// Delay in seconds between rounds
// Default: 10
ge_rounddelay 10

// Number of rounds in the current match.
// Calculates ge_roundtime.
// Default: 0
ge_roundcount 0

// Start players with the first weapon in the weaponset
// 0 - Slapper
// 1 - Slapper + level 1 weapon
// Default: 1
ge_startarmed 1

// Allow players to jump
// Default: 1
ge_allowjump 1

// Mode to choose for next gameplay
// 0 - Use gameplay from ge_gameplay for every map
// 1 - Select a random gameplay from gamecycle.txt
// 2 - Select the next gameplay (in order) from gamecycle.txt
// Default: 1
ge_gameplay_mode 1

// Automatically enable teamplay if the number of players is above this value
// and disable if below.
// Default: 10
ge_autoteam 12

// Set ge_autoteam to the value specified in the current map script file
// Default: 1
ge_autoautoteam 1

// Auto balance players on each team
// Default: 1
ge_teamautobalance 1

// Allow everyone to hear all voice chat
// Default: 0
sv_alltalk 1

// Cap on the number of weapons a player can drop on death in addition to their active one.
// Default: 1
ge_weapondroplimit 1

// How often weaponsets are allowed to repeat without weight penalty.
// Any that have been played within (this value)/2 rounds cannot be picked randomly.
// Default: 12
ge_loadouts_loadoutbuffercount 12

// If set to 1, server will avoid choosing maps where the current
// playercount is above the team threshold.
// Default: 0
ge_mapchooser_avoidteamplay 0

// How many other maps need to be played since the last 
// time a map was played before it can be selected randomly again.
// Default: 5
ge_mapchooser_mapbuffercount 5

// If set to 1, server will just use the mapcycle file and
// not choose randomly based on map script files.
// Default: 0
ge_mapchooser_usemapcycle 0

// The mapchooser will do everything it can to avoid switching
// between maps with this combined resintensity.
// Default: 14
ge_mapchooser_resthreshold 14

// Playercount must be exceeded before gamemodes other than 
// deathmatch will be randomly chosen
// Default: 4
ge_gameplay_threshold 4

// How much to take off of the weight of a mode for each time it appears in the buffer
// Default: 500
ge_gameplay_modebufferpenalty 500

// Allow players to pick up ammo from crate without picking up all of it
// Default: 0
ge_partialammopickups 0

// Minimum time in seconds before armor respawns
// Default: 14
ge_armorrespawntime

// Multiplier applied to playercount.
// ge_armorrespawntime * 10 - ge_armorrespawn_pc_scale * 
// (playercount - 1) ^ ge_armorrespawn_pc_pow.
// Default: 15
ge_armorrespawn_pc_scale 15

// Power applied to playercount
// Default: 0.5
ge_armorrespawn_pc_pow 0.5

// Minimum delay in seconds between respawns when
// ge_dynamicweaponrespawn is disabled
// Default: 6
ge_respawndelay 6

// Time in seconds between ammo respawns when
// ge_dynamicweaponrespawn is disabled
// Default: 10
ge_itemrespawntime 10

// Time in seconds between ammo respawns when
// ge_dynamicweaponrespawn is disabled
// Default: 10
ge_weaponrespawntime 10

// Changes the respawn delay for weapons and ammo to be
// based on how many players are connected
// Default: 1
ge_dynamicweaponrespawn 1

// Changes the dynamic respawn delay scale for weapons and ammo
// Default: 1.0
ge_dynamicweaponrespawn_scale 1.0

// Allow excessive Z forces on explosions
// Default: 1
ge_exp_allowz 1

// Scale the amount of push force from explosions on players
// Default: 1
ge_exp_pushscale 1

// Enable tournament mode that disables certain gameplay checks
// Default: 0
ge_tournamentmode 0

// Enable player radars
// Default: 1
ge_allowradar 1

// Change the radar range (in inches)
// Default: 1500 (125 feet)
ge_radar_range 1500

// Show enemies during teamplay
// Default: 1
ge_radar_showenemyteam 1

// Headshot kills create explosions
// Default: 0
ge_explosiveheadshots

// Player movement velocity multiplier. Applies in multiples of 0.5 [0.5 to 2.0]
// Default: 1.0
ge_velocity 1.0

// Enable paintball bullet decals
// Default: 0
ge_paintball 0

// Enable infinite ammo mode
// Default: 0
ge_infiniteammo 0

// Server will maintain this many players using bots.
// If more players join, the extra bots will disconnect.
// Default: 0
ge_bot_threshold 6

// Number of open slots to leave for incoming players
// Default: 1
ge_bot_openslots 1

// Count spectators in determining whether to leave an open player slot
// Default: 0
ge_bot_strict_openslot 0

// Give bots spawn protection
// Default: 0
ge_bot_givespawninvuln 0

// Set bot AI difficulty [0-9]
// Default: 6
ge_bot_difficulty 6